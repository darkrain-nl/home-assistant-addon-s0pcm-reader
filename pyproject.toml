[project]
name = "s0pcm-reader"
version = "5.0.10"
description = "S0PCM Reader Home Assistant App"
requires-python = ">=3.15"
dependencies = [
    "pyyaml==6.0.3",
    "serialx==1.15.1",
    "aiomqtt>=2.5.1",
    "pydantic==2.14.3",
]

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.4",
    "mypy>=2.4.1",
    "types-PyYAML>=6.0.12",
]

[tool.uv]
index-strategy = "unsafe-best-match"
exclude-newer = "3 days"

[tool.ruff]
# Same as Home Assistant
line-length = 120
target-version = "py315"
src = ["rootfs/usr/src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "RUF",# ruff-specific rules
    "S",  # flake8-bandit (security)
    "SIM",# flake8-simplify
    "PTH",# flake8-use-pathlib
]
ignore = [
    "E501", # Line too long (handled by formatter, but sometimes unavoidable)
    "B008", # Do not perform function call in argument defaults (fastapi dependency injection pattern, fine here too)
    "S310", # Audit URL open for permitted schemes (only hardcoded Supervisor API URLs used)
    "S603", # subprocess call - check for execution of untrusted input (not applicable)
    "S607", # Starting a process with a partial executable path (not applicable)
    "S104", # Possible binding to all interfaces (not applicable)
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "PTH"]  # assert, temp paths, and os.path are standard in pytest

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "rootfs/usr/src"
explicit_package_bases = true
files = ["rootfs/usr/src", "tests"]
exclude = ["^tests/standalone/"]

[[tool.mypy.overrides]]
# Mocks and fixtures make full annotations noise in tests.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-v --tb=short --strict-markers --disable-warnings -p no:cacheprovider"
asyncio_mode = "auto"
pythonpath = [
    "rootfs/usr/src",
    "tests",
    "."
]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "serial: Tests requiring serial port mocking",
    "mqtt: Tests requiring MQTT mocking",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["rootfs/usr/src"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
