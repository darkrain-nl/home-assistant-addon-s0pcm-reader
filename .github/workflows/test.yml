name: Tests

on:
  push:
    branches: [main, beta, develop, dev]
  pull_request:
    branches: [main, beta, develop, dev]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --frozen --group test

      - name: Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests with pytest
        run: |
          uv run pytest tests/ -v --tb=short --cov=rootfs/usr/src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  docker-test:
    name: Docker Test Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/Dockerfile.test
          tags: s0pcm-reader-test:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Run tests in container
        run: |
          docker run --rm \
            -v "$(pwd)/tests:/workspace/tests:ro" \
            s0pcm-reader-test

  standalone-test:
    name: Standalone Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Standalone Stack
        run: docker compose -f tests/standalone/docker-compose.yml build

      - name: Run Standalone Stack
        run: docker compose -f tests/standalone/docker-compose.yml up -d

      - name: Wait for Verifier
        run: |
          echo "Waiting for verification..."
          # Get container ID reliably
          VERIFIER_ID=$(docker compose -f tests/standalone/docker-compose.yml ps -q verifier)
          
          # Wait for exit code
          EXIT_CODE=$(docker wait $VERIFIER_ID)
          
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Verifier failed with exit code $EXIT_CODE"
            docker compose -f tests/standalone/docker-compose.yml logs
            exit 1
          fi
          echo "Verification passed!"

      - name: Cleanup
        if: always()
        run: docker compose -f tests/standalone/docker-compose.yml down

  validate:
    name: Validate Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version consistency
        run: |
          CONFIG_VERSION=$(grep '^version:' config.yaml | sed 's/version: *"\(.*\)"/\1/' | tr -d '\r')
          PYPROJECT_VERSION=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/' | tr -d '\r')

          echo "config.yaml:   $CONFIG_VERSION"
          echo "pyproject.toml: $PYPROJECT_VERSION"

          if [ "$CONFIG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version mismatch: config.yaml ($CONFIG_VERSION) != pyproject.toml ($PYPROJECT_VERSION)"
            exit 1
          fi
          echo "✅ Versions match: $CONFIG_VERSION"

      - name: Check Python versions match
        run: |
          FOUND=$(git ls-files build.yaml '*Dockerfile*' '.github/workflows/*.yml' \
            | xargs grep -oE '(python:|python-version: ")[0-9]+\.[0-9]+')
          echo "$FOUND"

          if [ "$(echo "$FOUND" | grep -oE '[0-9]+\.[0-9]+$' | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::Python versions differ between images and workflows"
            exit 1
          fi
          echo "✅ Python versions match"

      - name: Check CHANGELOG entry exists
        run: |
          VERSION=$(grep '^version:' config.yaml | sed 's/version: *"\(.*\)"/\1/' | tr -d '\r')

          # For beta versions, check the base version (strip -bN suffix)
          CHECK_VERSION=$(echo "$VERSION" | sed 's/-b[0-9]*$//')

          if grep -q "## \[$CHECK_VERSION" CHANGELOG.md; then
            echo "✅ CHANGELOG entry found for version $CHECK_VERSION"
          else
            echo "::error::No CHANGELOG entry found for version $CHECK_VERSION"
            exit 1
          fi

  publish:
    name: Publish
    needs: [test, docker-test, standalone-test, validate]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') &&
      !startsWith(github.event.head_commit.message, 'ci: bump beta version')
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml # zizmor: ignore[self-repository]
    secrets:
      BETA_SYNC_TOKEN: ${{ secrets.BETA_SYNC_TOKEN }}
